   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Invitación</title>
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/ss-abigail" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Eliminamos márgenes generales y unificamos el fondo para que no se vean cortes */
        body { margin: 0; font-family: 'SS Abigail', sans-serif; background-color: #FFFFFF; text-align: center; width: 100%; overflow-x: hidden; }
        
        /* Modificado: Ahora ocupa el 100% real de cualquier celular sin límites */
        .content-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; margin: 0; background-color: #FFFFFF; }
        
        .full-img { width: 100%; display: block; height: auto; }
        .section-colored { background-color: #A2AC86; padding: 25px 0; width: 100%; }
        .section-light { background-color: #D2D7C7; padding: 30px 0; width: 100%; }

        /* Estilos Reproductor */
        .player { width: 85%; max-width: 300px; margin: 0 auto; text-align: center; color: #FFFFFF; }
        .title { font-size: 20px; margin-bottom: 10px; color: #FFFFFF; text-shadow: 0.5px 0 #FFFFFF, -0.5px 0 #FFFFFF, 0 0.5px #FFFFFF, 0 -0.5px #FFFFFF; }
        .bar { height: 2px; background: rgba(255,255,255,0.3); position: relative; margin: 10px 0 18px; }
        .progress { height: 100%; width: 0%; background: #FFFFFF; position: absolute; top: 0; left: 0; }
        .dot { width: 10px; height: 10px; background: #FFFFFF; border-radius: 50%; position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%); transition: .1s linear; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .btn, .play { cursor: pointer; opacity: .7; transition: .2s; }
        .play { width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; }
        .play svg { fill: black; width: 18px; height: 18px; }
        .btn svg { fill: #FFFFFF; width: 16px; height: 16px; }
        audio { display: none; }

        /* Estilos Cuenta Regresiva */
        .countdown { display:flex; gap:25px; align-items:flex-end; justify-content:center; padding: 0 10px; }
        .block { text-align:center; position:relative; flex: 1; max-width: 70px; }
        .number { font-size:42px; color:#FFFFFF; line-height:1; letter-spacing:1px; font-weight:700; -webkit-text-stroke:0.8px rgba(255,255,255,0.35); text-shadow: 0 1px 0 rgba(255,255,255,0.15), 0 2px 6px rgba(0,0,0,0.15); }
        .block::after { content:""; display:block; width:100%; height:1px; background:rgba(255,255,255,0.6); margin:8px auto 6px; }
        .label { font-size:10px; letter-spacing:2px; color:#FFFFFF; font-weight:700; opacity:0.95; -webkit-text-stroke:0.4px rgba(255,255,255,0.35); text-shadow: 0 1px 1px rgba(0,0,0,0.35), 0 0 6px rgba(255,255,255,0.15); }

        /* AJUSTE DE GALERÍA: Ocupa todo el ancho sin deformar */
        .slider-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 4 / 5; 
            overflow: hidden; 
            background: linear-gradient(135deg, #f5f5f5, #e8ebd9);
        }
        .slider-container img { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Cambiado a cover para llenar por completo el espacio de la galería en pantalla */
            opacity: 0; 
            transition: opacity 1.0s ease-in-out; 
        }
        .slider-container img.active { opacity: 1; }

        /* Formulario responsivo */
        .loc-btn { display: inline-block; padding: 15px 40px; background-color: #A2AC86; color: #FFFFFF; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .container { width: 85%; max-width: 400px; margin: auto; }
        label.titulo { display: block; margin-top: 28px; font-family: 'Cinzel', serif; font-size: 13px; color: #B38E5D; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #D1C4B6; border-radius: 12px; background: #FAF6F0; color: #8A7A6B; box-sizing: border-box; }
        .opciones-asistencia { display: flex; border: 1px solid #D1C4B6; border-radius: 12px; background: #FAF6F0; overflow: hidden; }
        .opcion-item { flex: 1; padding: 14px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 12px; color: #8A7A6B; }
        .opcion-item input { display: none; } /* Esconde el radio button feo por defecto */
        .opcion-item:has(input:checked) { background-color: #A2AC86; color: #FFFFFF; }
        button { background: #A2AC86; color: #FFFFFF; padding: 16px; border: none; border-radius: 25px; width: 100%; margin-top: 30px; font-family: 'Cinzel', serif; text-transform: uppercase; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="content-wrapper">
    <img src="portada.jpg" class="full-img">

    <div class="section-colored">
        <div class="player">
            <div class="title">Dale play a mi canción</div>
            <div class="bar"><div class="progress" id="progress"></div><div class="dot" id="dot"></div></div>
            <div class="controls">
                <div class="btn" onclick="audio.currentTime -= 10"><svg viewBox="0 0 24 24"><path d="M11 19V5l-9 7 9 7zm2-14v14l9-7-9-7z"/></svg></div>
                <div class="play" onclick="togglePlay()"><svg id="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                <div class="btn" onclick="audio.currentTime += 10"><svg viewBox="0 0 24 24"><path d="M13 5v14l9-7-9-7zm-2 14V5l-9 7 9 7z"/></svg></div>
            </div>
            <audio id="audio"><source src="https://regalalasestrellas.weebly.com/uploads/1/3/2/0/132094004/jane_zhang_-_dream_it_possible__lyrics_.mp3"></audio>
        </div>
    </div>

    <img src="entrada.jpg" class="full-img">
    <img src="papas y padrinos.jpg" class="full-img">

    <div class="section-colored">
        <section>
            <div class="countdown">
                <div class="block"><div id="days" class="number"></div><div class="label">DÍAS</div></div>
                <div class="block"><div id="hours" class="number"></div><div class="label">HORAS</div></div>
                <div class="block"><div id="minutes" class="number"></div><div class="label">MINUTOS</div></div>
                <div class="block"><div id="seconds" class="number"></div><div class="label">SEGS</div></div>
            </div>
        </section>
    </div>

    <img src="titulo.jpg" class="full-img">
    <div class="section-light"><a href="#" class="loc-btn">VER UBICACIÓN</a></div>
    <img src="fecha.jpg" class="full-img">
    <div class="section-light"><a href="#" class="loc-btn">VER UBICACIÓN</a></div>
    <img src="vestimenta.jpg" class="full-img">
    
    <img src="galeria.jpg" class="full-img">
    <!-- Galería -->
    <div class="slider-container">
        <img src="https://i.imgur.com/gdSftxX.jpeg" class="active">
        <img src="https://i.imgur.com/JGwlEoc.jpeg">
        <img src="https://i.imgur.com/OgseElR.jpeg">
        <img src="https://i.imgur.com/2wa2pyB.jpeg">
        <img src="https://i.imgur.com/uDYCvFS.jpeg">
        <img src="https://i.imgur.com/g8WcMS8.jpeg">
    </div>

    <img src="regalos.jpg" class="full-img">
    <img src="confirmacion.jpg" class="full-img">

    <div class="section-light">
        <div class="container">
            <form id="rsvpForm">
                <label class="titulo">Nombre Completo</label>
                <input type="text" name="nombre" required>
                <label class="titulo">¿Asistirás?</label>
                <div class="opciones-asistencia">
                    <label class="opcion-item"><input type="radio" name="asistencia" value="1" checked> SÍ</label>
                    <label class="opcion-item"><input type="radio" name="asistencia" value="0"> NO</label>
                </div>
                <label class="titulo">Mensaje</label>
                <textarea name="mensaje" rows="3"></textarea>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>
</div>

<script>
    const audio = document.getElementById("audio"), icon = document.getElementById("icon"), progress = document.getElementById("progress"), dot = document.getElementById("dot");
    function togglePlay(){
        if(audio.paused){ audio.play(); icon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; }
        else{ audio.pause(); icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
    }
    audio.addEventListener("timeupdate", ()=>{ const p = (audio.currentTime/audio.duration)*100; progress.style.width = p + "%"; dot.style.left = p + "%"; });

    const DATE_TARGET = new Date(2026, 7, 1, 18, 0, 0);
    function updateCountdown(){
        const now = new Date(), dur = Math.max(DATE_TARGET - now, 0);
        document.getElementById('days').textContent = Math.floor(dur / (1000 * 60 * 60 * 24));
        document.getElementById('hours').textContent = (Math.floor((dur % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)) < 10 ? '0' : '') + Math.floor((dur % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById('minutes').textContent = (Math.floor((dur % (1000 * 60 * 60)) / (1000 * 60)) < 10 ? '0' : '') + Math.floor((dur % (1000 * 60 * 60)) / (1000 * 60));
        document.getElementById('seconds').textContent = (Math.floor((dur % (1000 * 60)) / 1000) < 10 ? '0' : '') + Math.floor((dur % (1000 * 60)) / 1000);
    }
    setInterval(updateCountdown, 1000); updateCountdown();

    const images = document.querySelectorAll('.slider-container img');
    let current = 0;
    setInterval(() => {
        images[current].classList.remove('active');
        current = (current + 1) % images.length;
        images[current].classList.add('active');
    }, 3000);
</script>
</body>
</html>
